apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          ports:
            - containerPort: 16686
            - containerPort: 4317
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: aiops
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: aiops
spec:
  selector:
    app: jaeger
  ports:
    - port: 4317
      targetPort: 4317
